<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartoon Audio Short Studio</title>
<style>html,body{margin:0;background:#17131f;width:100%;height:100%;overflow:hidden}body{display:grid;place-items:center}canvas{width:min(56.25vh,100vw);height:min(100vh,177.777vw);display:block;background:#f7c96b}</style></head>
<body><canvas id="frame" width="1080" height="1920"></canvas><script>
const canvas=document.getElementById('frame'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
const lerp=(a,b,t)=>a+(b-a)*t;
function cloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#fff4d8';ctx.beginPath();ctx.arc(-35,0,35,0,Math.PI*2);ctx.arc(0,-18,48,0,Math.PI*2);ctx.arc(43,0,34,0,Math.PI*2);ctx.fill();ctx.restore();}
function character(x,y,t,shirt,expression){const bob=Math.sin(t*.12)*10;ctx.save();ctx.translate(x,y+bob);ctx.fillStyle='rgba(35,22,39,.18)';ctx.beginPath();ctx.ellipse(0,190,105,25,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#34243a';ctx.lineWidth=18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-38,115);ctx.lineTo(-48,185);ctx.moveTo(38,115);ctx.lineTo(48,185);ctx.stroke();ctx.fillStyle=shirt;ctx.strokeStyle='#34243a';ctx.lineWidth=16;ctx.beginPath();ctx.roundRect(-90,10,180,135,55);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-80,35);ctx.lineTo(-135,95+Math.sin(t*.16)*12);ctx.moveTo(80,35);ctx.lineTo(135,90-Math.sin(t*.16)*12);ctx.stroke();ctx.fillStyle='#f0b98e';ctx.strokeStyle='#34243a';ctx.lineWidth=15;ctx.beginPath();ctx.ellipse(0,-75,100,115,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#34243a';ctx.beginPath();ctx.ellipse(-34,-88,10,15,0,0,Math.PI*2);ctx.ellipse(34,-88,10,15,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#8e3e48';ctx.lineWidth=8;ctx.beginPath();if(expression==='surprised')ctx.arc(0,-38,16,0,Math.PI*2);else ctx.arc(0,-48,34,.15,Math.PI-.15);ctx.stroke();ctx.restore();}
window.renderFrame=function(frame){const t=frame/30;const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#83d4e5');sky.addColorStop(.65,'#f9d18a');sky.addColorStop(1,'#f5a66e');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffe9a8';ctx.beginPath();ctx.arc(820,300,115,0,Math.PI*2);ctx.fill();cloud((180+t*24)%(W+300)-100,330,1.15);cloud((690-t*12+W+300)%(W+300)-100,520,.8);ctx.fillStyle='#80a96c';ctx.beginPath();ctx.moveTo(0,1050);ctx.quadraticCurveTo(350,820,700,1030);ctx.quadraticCurveTo(930,870,1080,980);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#4f805c';ctx.beginPath();ctx.moveTo(0,1300);ctx.quadraticCurveTo(430,1060,780,1320);ctx.quadraticCurveTo(960,1190,1080,1250);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();for(let i=0;i<4;i++){const x=90+i*280,y=1130+(i%2)*90;ctx.fillStyle='#f5d7a0';ctx.fillRect(x,y,170,190);ctx.fillStyle='#a64f48';ctx.beginPath();ctx.moveTo(x-20,y);ctx.lineTo(x+85,y-105);ctx.lineTo(x+190,y);ctx.fill();ctx.fillStyle='#6a4540';ctx.fillRect(x+65,y+95,42,95);}ctx.fillStyle='#e9c58c';ctx.beginPath();ctx.moveTo(390,H);ctx.quadraticCurveTo(500,1500,650,1370);ctx.quadraticCurveTo(800,1510,760,H);ctx.fill();const reveal=Math.max(0,Math.min(1,(t-.25)*2));character(lerp(-180,390,reveal),1470,t,'#bd5366','happy');character(lerp(1260,720,reveal),1490,t+12,'#496e9b',t>2?'surprised':'happy');ctx.strokeStyle='#315d48';ctx.lineWidth=9;for(let i=0;i<28;i++){const x=(i*83+frame*1.7)%W,y=1650+(i%5)*45;ctx.beginPath();ctx.moveTo(x,y+40);ctx.lineTo(x-12,y);ctx.stroke();}return true;};window.renderFrame(0);
</script></body></html>
